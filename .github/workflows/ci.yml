name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Verify locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --no-deps -r requirements.lock.txt
          .venv/bin/python -m pip check
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend
      - name: Run quality and security gates
        run: |
          PATH="$PWD/.venv/bin:$PATH" make check
          PATH="$PWD/.venv/bin:$PATH" make security
          .venv/bin/pip-audit -r requirements.lock.txt
