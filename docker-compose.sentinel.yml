# Sentinel is a DEV/DEMO reference remote-signer stack (SIGNER_TYPE=env_private_key), not a
# production custody path -- see docs/CUSTODY.md for production signer options (keystore,
# a KMS/HSM-backed remote proxy, cb_mpc_2pc). It is reachable only on the compose-internal
# network (no host port publish); both services must be given the SAME long, random token
# via SENTINEL_AUTH_TOKEN / REMOTE_SIGNER_AUTH_TOKEN in the host environment before starting
# this stack -- sentinel fails closed (503 on every request) until that token is >=32 chars.
# The readytrader service is the approval/dashboard API server (--target api); it also needs
# API_JWT_SECRET (and API_ADMIN_PASSWORD_HASH to sign in), as in docker-compose.yml.
services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn sentinel.app:app --host 0.0.0.0 --port 8888
    environment:
      - SIGNER_TYPE=env_private_key
      - PRIVATE_KEY=${PRIVATE_KEY}
      - SENTINEL_AUTH_TOKEN=${SENTINEL_AUTH_TOKEN}
    expose:
      - "8888"

  readytrader:
    # The approval/dashboard API server (the image's default stage is the stdio MCP server, which
    # exits at once with no client attached).
    build:
      context: .
      target: api
    environment:
      # The API server refuses to start without auth outside DEV_MODE (see docker-compose.yml).
      - API_AUTH_REQUIRED=true
      - API_JWT_SECRET=${API_JWT_SECRET:?set API_JWT_SECRET (see the header of docker-compose.yml)}
      - API_ADMIN_USERNAME=${API_ADMIN_USERNAME:-admin}
      - API_ADMIN_PASSWORD_HASH=${API_ADMIN_PASSWORD_HASH}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SIGNER_TYPE=remote
      - SIGNER_REMOTE_URL=http://sentinel:8888
      # Plaintext is acceptable only because this hop never leaves the compose-internal
      # network; RemoteSigner refuses non-https URLs unless this is explicitly false.
      - REMOTE_SIGNER_REQUIRE_TLS=false
      - REMOTE_SIGNER_AUTH_TOKEN=${REMOTE_SIGNER_AUTH_TOKEN}
    depends_on:
      - sentinel
